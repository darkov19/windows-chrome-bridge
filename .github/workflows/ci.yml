name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        # The oldest Python that users need (Ubuntu 24.04 has 3.12), and the newest stable one.
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: python build.py
      - name: Unit tests
        run: python tests/run.py
